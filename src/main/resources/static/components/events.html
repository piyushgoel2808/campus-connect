<div class="cc-page-section">
    <div class="cc-page-header">
        <div>
            <span class="cc-section-kicker"><i class="fas fa-calendar-alt"></i> Events</span>
            <h2 class="cc-page-title mt-2 mb-1">Upcoming events</h2>
            <p class="cc-page-subtitle">Make events feel like highlights, not plain listings, with cleaner spacing and stronger cards.</p>
        </div>
        <button id="btnAddEvent" class="btn btn-primary d-none" data-bs-toggle="modal" data-bs-target="#eventModal">
            <i class="fas fa-plus me-1"></i> Post New Event
        </button>
    </div>

    <div id="eventsContainer" class="row g-4">
        <div class="col-12">
            <div class="cc-empty-state cc-panel">
                <div class="spinner-border text-primary mb-3"></div>
                <h5 class="mb-2">Loading events</h5>
                <p class="mb-0">Fetching upcoming events and RSVPs...</p>
            </div>
        </div>
    </div>
</div>

<div class="modal fade cc-profile-modal" id="eventModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create event</h5>
                <button type="button" class="btn-close" aria-label="Close publish event modal" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Event Title</label>
                    <input type="text" class="form-control" id="evtTitle" placeholder="e.g. Alumni Meetup 2026">
                </div>
                <div class="mb-3">
                    <label class="form-label">Date & Time</label>
                    <input type="datetime-local" class="form-control" id="evtDate" aria-label="Event date and time">
                </div>
                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" id="evtLoc" placeholder="e.g. Main Auditorium / Zoom Link">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" id="evtDesc" rows="3" placeholder="Describe the event"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="window.publishNewEvent()">Publish Event</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade cc-profile-modal" id="editEventModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit event</h5>
                <button type="button" class="btn-close" aria-label="Close edit event modal" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editEventId">
                <div class="mb-3">
                    <label class="form-label">Event Title</label>
                    <input type="text" class="form-control" id="editEventTitle" placeholder="Event title">
                </div>
                <div class="mb-3">
                    <label class="form-label">Date & Time</label>
                    <input type="datetime-local" class="form-control" id="editEventDate" aria-label="Edit event date and time">
                </div>
                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" id="editEventLoc" placeholder="Location">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" id="editEventDesc" rows="3" placeholder="Describe the event"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="window.submitEditEvent()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade cc-profile-modal" id="participantsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="fas fa-users"></i> Event Participants</h5>
                <button type="button" class="btn-close" aria-label="Close participants modal" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul class="list-group" id="participantsList">
                    <li class="list-group-item text-center">Loading...</li>
                </ul>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
