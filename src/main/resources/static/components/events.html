<div class="cc-page-section">
    <div class="cc-page-header">
        <div>
            <span class="cc-section-kicker"><i class="fas fa-calendar-alt"></i> Events & Workshops</span>
            <h2 class="cc-page-title">Campus & Alumni Events</h2>
            <p class="cc-page-subtitle">Participate in mentorship webinars, tech talks, alumni reunions, and industry workshops.</p>
        </div>
        <button id="btnAddEvent" class="btn btn-primary d-none" data-bs-toggle="modal" data-bs-target="#eventModal">
            <i class="fas fa-plus me-1"></i> Create Event
        </button>
    </div>

    <!-- Events Grid -->
    <div id="eventsContainer" class="row g-4">
        <div class="col-12">
            <div class="cc-empty-state cc-panel">
                <div class="spinner-border text-primary mb-3"></div>
                <h5 class="mb-2">Loading events</h5>
                <p class="mb-0">Fetching upcoming events and RSVP status...</p>
            </div>
        </div>
    </div>
</div>

<!-- Create Event Modal -->
<div class="modal fade cc-profile-modal" id="eventModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title d-flex align-items-center gap-2">
                    <i class="fas fa-calendar-plus"></i> Create New Event
                </h5>
                <button type="button" class="btn-close btn-close-white" aria-label="Close publish event modal" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Event Title</label>
                    <input type="text" class="form-control" id="evtTitle" placeholder="e.g. Alumni Tech Talk: AI & Cloud Computing">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Date & Time</label>
                    <input type="datetime-local" class="form-control" id="evtDate" aria-label="Event date and time">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Location / Meeting Link</label>
                    <input type="text" class="form-control" id="evtLoc" placeholder="e.g. Auditorium / Google Meet / Zoom link">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Event Description</label>
                    <textarea class="form-control" id="evtDesc" rows="3" placeholder="Describe the agenda, speakers, and audience..."></textarea>
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary px-4" onclick="window.publishNewEvent()">
                    <i class="fas fa-paper-plane me-1"></i> Publish Event
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Event Modal -->
<div class="modal fade cc-profile-modal" id="editEventModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title d-flex align-items-center gap-2">
                    <i class="fas fa-edit"></i> Edit Event
                </h5>
                <button type="button" class="btn-close btn-close-white" aria-label="Close edit event modal" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="editEventId">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Event Title</label>
                    <input type="text" class="form-control" id="editEventTitle" placeholder="Event title">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Date & Time</label>
                    <input type="datetime-local" class="form-control" id="editEventDate" aria-label="Edit event date and time">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Location / Meeting Link</label>
                    <input type="text" class="form-control" id="editEventLoc" placeholder="Location">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Description</label>
                    <textarea class="form-control" id="editEventDesc" rows="3" placeholder="Describe the event"></textarea>
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary px-4" onclick="window.submitEditEvent()">
                    <i class="fas fa-check me-1"></i> Save Changes
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Event Participants Modal -->
<div class="modal fade cc-profile-modal" id="participantsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title d-flex align-items-center gap-2">
                    <i class="fas fa-users"></i> Event Participants
                </h5>
                <button type="button" class="btn-close btn-close-white" aria-label="Close participants modal" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <ul class="list-group list-group-flush" id="participantsList">
                    <li class="list-group-item text-center py-3 text-muted">Loading participants...</li>
                </ul>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
