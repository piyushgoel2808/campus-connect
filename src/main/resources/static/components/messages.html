<!--
  ============================================================================
  FILE: src/main/resources/static/components/messages.html
  PURPOSE: Direct Messages & Recent Conversations partial view (injected into
           `#main-content` when the user switches to `#tab-messages`).

  CONTROLLER MODULE:
    - `js/modules/chat.js` (`fetchRecentChats()`, `window.startDirectChat()`)

  DOM SECTIONS:
    1. `.cc-page-header`  : Section title and subtitle.
    2. `#recentChatsList` : Populated by `fetchRecentChats()` with conversation
                            partners returned from `GET /api/messages/partners`.
                            Clicking any partner opens `#dmModal` (in `dashboard.html`).
  ============================================================================
-->
<div class="cc-page-section">
    <!-- Page Header -->
    <div class="cc-page-header">
        <div>
            <span class="cc-section-kicker"><i class="fas fa-comments"></i> Direct Messages</span>
            <h2 class="cc-page-title">Recent Conversations</h2>
            <p class="cc-page-subtitle">Connect one-on-one with peers, seniors, and mentors for career guidance and discussions.</p>
        </div>
    </div>

    <!-- Active Inbox Panel: Populated by fetchRecentChats() in js/modules/chat.js -->
    <div class="cc-panel">
        <div class="cc-panel-header">
            <h5 class="mb-0 fw-bold text-secondary d-flex align-items-center gap-2">
                <i class="fas fa-inbox text-primary"></i> Active Inbox
            </h5>
        </div>
        <div id="recentChatsList" class="cc-list-grid cc-panel-body">
            <div class="cc-empty-state">
                <i class="fas fa-comments"></i>
                <h5 class="mb-2">Loading conversations</h5>
                <p class="mb-0">Fetching your recent direct messages...</p>
            </div>
        </div>
    </div>
</div>
