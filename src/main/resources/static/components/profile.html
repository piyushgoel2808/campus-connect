<!--
  ============================================================================
  FILE: src/main/resources/static/components/profile.html
  PURPOSE: Current User Profile & Notification Preferences partial view
           (injected into `#main-content` when the user switches to `#tab-profile`).

  CONTROLLER MODULE:
    - `js/modules/profile.js` (`loadProfile()`, `window.saveProfile()`)

  FORM FIELDS (Populated from `GET /api/users/me` & saved to `PUT /api/users/profile`):
    - `#pHeadline`       : Professional headline (e.g., "SDE at Microsoft | MCA '24")
    - `#pCompany`        : Current company or institution
    - `#pDesignation`    : Current role or designation
    - `#pSkills`         : Comma-separated skills & technologies
    - `#pExperience`     : Bio & career experience summary
    - `#pLinkedin`       : LinkedIn profile URL
    - `#pGithub`         : GitHub profile URL
    - `#pNotifyMessages` : Toggle switch for direct message notifications
    - `#pNotifyEvents`   : Toggle switch for campus event notifications
    - `#pNotifyJobs`     : Toggle switch for new job posting notifications
  ============================================================================
-->
<div class="cc-page-section">
    <!-- Page Header & Save Profile Action Button -->
    <div class="cc-page-header">
        <div>
            <span class="cc-section-kicker"><i class="fas fa-user-gear"></i> Settings</span>
            <h2 class="cc-page-title">Your Profile & Preferences</h2>
            <p class="cc-page-subtitle">Keep your professional information and portfolio links updated so peers and recruiters can find you.</p>
        </div>
        <button class="btn btn-primary px-4" onclick="saveProfile()">
            <i class="fas fa-save me-1"></i> Save Profile
        </button>
    </div>

    <!-- Profile & Preferences Form Panel -->
    <div class="cc-panel p-4">
        <div class="row g-4">
            <!-- 1. Professional Summary (#pHeadline) -->
            <div class="col-12">
                <div class="cc-divider-title">
                    <i class="fas fa-briefcase text-primary"></i> Professional Headline
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Headline</label>
                    <input type="text" id="pHeadline" class="form-control" placeholder="e.g. SDE at Microsoft | BVICAM MCA '24 | Cloud & Backend">
                </div>
            </div>

            <!-- 2. Current Employment / Role (#pCompany, #pDesignation) -->
            <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">Current Company or Institution</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-building text-muted"></i></span>
                    <input type="text" id="pCompany" class="form-control" placeholder="Company or College name">
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">Role or Designation</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-id-badge text-muted"></i></span>
                    <input type="text" id="pDesignation" class="form-control" placeholder="e.g. Associate Engineer / Student">
                </div>
            </div>

            <!-- 3. Skills & Career Experience (#pSkills, #pExperience) -->
            <div class="col-12">
                <label class="form-label text-muted small fw-bold">Skills & Technologies</label>
                <input type="text" id="pSkills" class="form-control" placeholder="e.g. Java, Spring Boot, React, AWS, Docker, Python">
            </div>

            <div class="col-12">
                <label class="form-label text-muted small fw-bold">Bio & Career Experience</label>
                <textarea id="pExperience" class="form-control" rows="3" placeholder="Briefly describe your career background, projects, or interests..."></textarea>
            </div>

            <!-- 4. Social & Portfolio Links (#pLinkedin, #pGithub) -->
            <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">LinkedIn Profile URL</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fab fa-linkedin text-primary"></i></span>
                    <input type="text" id="pLinkedin" class="form-control" placeholder="https://linkedin.com/in/username">
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">GitHub Profile URL</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fab fa-github text-dark"></i></span>
                    <input type="text" id="pGithub" class="form-control" placeholder="https://github.com/username">
                </div>
            </div>

            <!-- 5. Notification Preferences (#pNotifyMessages, #pNotifyEvents, #pNotifyJobs) -->
            <div class="col-12 pt-3 border-top">
                <div class="cc-divider-title">
                    <i class="fas fa-bell text-primary"></i> Notification Preferences
                </div>
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="p-3 border rounded-3 bg-light d-flex align-items-center justify-content-between">
                            <div>
                                <strong class="d-block text-secondary small">Direct Messages</strong>
                                <small class="text-muted">Chat alerts</small>
                            </div>
                            <div class="form-check form-switch m-0">
                                <input class="form-check-input" type="checkbox" id="pNotifyMessages" checked>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 border rounded-3 bg-light d-flex align-items-center justify-content-between">
                            <div>
                                <strong class="d-block text-secondary small">Campus Events</strong>
                                <small class="text-muted">Upcoming talks & webinars</small>
                            </div>
                            <div class="form-check form-switch m-0">
                                <input class="form-check-input" type="checkbox" id="pNotifyEvents" checked>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 border rounded-3 bg-light d-flex align-items-center justify-content-between">
                            <div>
                                <strong class="d-block text-secondary small">Career Alerts</strong>
                                <small class="text-muted">New job postings</small>
                            </div>
                            <div class="form-check form-switch m-0">
                                <input class="form-check-input" type="checkbox" id="pNotifyJobs" checked>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
