<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="container">
        <div class="login-card">
            <h2 class="brand-header">🎓 Campus Connect</h2>
            <p class="auth-subtitle">Sign in to connect with students, alumni, jobs, events, and your campus community.</p>
            
            <div id="alertBox" class="alert alert-danger d-none"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
                    <input type="email" id="email" class="form-control" placeholder="name@bvicam.in" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">PASSWORD</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill mt-2">Sign In</button>
            </form>
            
            <div class="text-center mt-4">
                <a href="index.html" class="text-decoration-none auth-footer-link small">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
