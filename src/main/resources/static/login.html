<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - GradLink</title>
    <meta name="description" content="Sign in or register for GradLink, the exclusive BVICAM student and alumni networking platform.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Custom Theme Tokens & Auth Styles -->
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="container">
        <div class="login-card">
            <div class="text-center mb-3">
                <span class="badge badge-bvicam mb-2">BVICAM Community Portal</span>
                <div class="brand-header">
                    <div class="brand-icon-box">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <span>GradLink</span>
                </div>
                <p class="auth-subtitle" id="authSubtitle">Sign in to connect with students, alumni, jobs, events, and the GradLink community.</p>
            </div>

            <!-- Mode Toggle -->
            <div class="btn-group w-100 mb-3" role="group" aria-label="Authentication mode">
                <button type="button" id="showLoginTab" class="btn btn-primary btn-sm fw-semibold" onclick="switchAuthMode('login')">Sign In</button>
                <button type="button" id="showRegisterTab" class="btn btn-outline-primary btn-sm fw-semibold" onclick="switchAuthMode('register')">Register</button>
            </div>

            <!-- Dynamic Alert Box -->
            <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Institutional Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="name@bvicam.in" required autocomplete="email">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', 'togglePasswordIcon')" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-submit shadow-sm">
                    <span>Sign In to GradLink</span>
                    <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>

            <!-- Self-Registration Form (Student / Alumni) -->
            <form id="registerForm" class="d-none">
                <div class="mb-2">
                    <label for="regName" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" id="regName" class="form-control" placeholder="Your full name" required autocomplete="name">
                    </div>
                </div>

                <div class="mb-2">
                    <label for="regEmail" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="regEmail" class="form-control" placeholder="name@bvicam.in" required autocomplete="email">
                    </div>
                </div>

                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label for="regRole" class="form-label">Role</label>
                        <select id="regRole" class="form-select">
                            <option value="STUDENT" selected>Student</option>
                            <option value="ALUMNI">Alumni</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label for="regDept" class="form-label">Department</label>
                        <select id="regDept" class="form-select">
                            <option value="MCA" selected>MCA</option>
                            <option value="BJMC">BJMC</option>
                            <option value="">Other</option>
                        </select>
                    </div>
                </div>

                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label for="regBatch" class="form-label">Batch Year</label>
                        <input type="number" id="regBatch" class="form-control" placeholder="e.g. 2026" min="1995" max="2035">
                    </div>
                    <div class="col-6">
                        <label for="regEnrollment" class="form-label">Enrollment No.</label>
                        <input type="text" id="regEnrollment" class="form-control" placeholder="Optional">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="regPassword" class="form-label">Password (min 6 chars)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" id="regPassword" class="form-control" placeholder="Create password" minlength="6" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regPassword', 'toggleRegPasswordIcon')" aria-label="Toggle registration password visibility">
                            <i class="fas fa-eye" id="toggleRegPasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-submit shadow-sm">
                    <span>Create GradLink Account</span>
                    <i class="fas fa-user-plus ms-2"></i>
                </button>
            </form>

            <!-- Navigation link back to public landing page -->
            <div class="text-center mt-3 pt-2 border-top">
                <a href="index.html" class="auth-footer-link">
                    <i class="fas fa-chevron-left small"></i>
                    <span>Back to GradLink Home</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId = "password", iconId = "togglePasswordIcon") {
            const pwd = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!pwd || !icon) return;
            if (pwd.type === "password") {
                pwd.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                pwd.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
    <script src="js/app.js"></script>
</body>
</html>
