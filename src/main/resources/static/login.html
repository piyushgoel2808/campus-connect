<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GradLink</title>
    <meta name="description" content="Sign in to GradLink, the exclusive BVICAM student and alumni networking platform.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom Theme Tokens & Auth Styles -->
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="container">
        <div class="login-card">
            <div class="text-center mb-3">
                <span class="badge badge-bvicam mb-2">BVICAM Community Portal</span>
                <div class="brand-header">
                    <div class="brand-icon-box">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <span>GradLink</span>
                </div>
                <p class="auth-subtitle">Sign in to connect with students, alumni, jobs, events, and the GradLink community.</p>
            </div>
            
            <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Institutional Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="name@bvicam.in" required autocomplete="email">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-submit shadow-sm">
                    <span>Sign In to GradLink</span>
                    <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>
            
            <div class="text-center mt-3 pt-2 border-top">
                <a href="index.html" class="auth-footer-link">
                    <i class="fas fa-chevron-left small"></i>
                    <span>Back to GradLink Home</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Password visibility toggle script & app.js -->
    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById("password");
            const icon = document.getElementById("togglePasswordIcon");
            if (pwd.type === "password") {
                pwd.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                pwd.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
    <script src="js/app.js"></script>
</body>
</html>
