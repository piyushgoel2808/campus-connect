<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/shell.css" rel="stylesheet">
</head>
<body class="shell-page">

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-primary" href="#"><i class="fas fa-graduation-cap me-2"></i>Campus Connect</a>
        <div class="d-flex align-items-center">
            <div class="dropdown me-2">
                <button class="btn btn-light border notification-btn" id="notificationMenuBtn" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Open notifications">
                    <i class="fas fa-bell"></i>
                    <span id="notificationBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
                </button>
                <div class="dropdown-menu dropdown-menu-end p-0 notification-dropdown" aria-labelledby="notificationMenuBtn">
                    <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
                        <strong class="small">Notifications</strong>
                        <button class="btn btn-sm btn-link text-decoration-none p-0" id="markAllNotificationsRead" type="button">Mark all read</button>
                    </div>
                    <div id="notificationList" class="py-1">
                        <div class="small text-muted px-3 py-2">Loading notifications...</div>
                    </div>
                </div>
            </div>
            <span class="fw-bold me-2 d-none d-md-block" id="welcomeUser">...</span>
            <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4 px-4">
    <div class="row g-4">

        <div class="col-lg-2 d-none d-lg-block">
            <div class="nav flex-column nav-pills sticky-top shell-sticky-nav cc-shell-panel p-2">
                <button class="nav-link active" id="tab-messages" aria-label="Open messages" onclick="switchTab('messages')"><i class="fas fa-comment-dots me-2"></i> Messages <span id="msgBadge" class="badge bg-danger ms-2 d-none">New</span></button>
                <button class="nav-link" id="tab-directory" aria-label="Open directory" onclick="switchTab('directory')"><i class="fas fa-users me-2"></i> Directory</button>
                <button class="nav-link" id="tab-events" aria-label="Open events" onclick="switchTab('events')"><i class="fas fa-calendar-alt me-2"></i> Events</button>
                <button class="nav-link" id="tab-jobs" aria-label="Open jobs" onclick="switchTab('jobs')"><i class="fas fa-briefcase me-2"></i> Jobs</button>
                <button class="nav-link" id="tab-wall" aria-label="Open wall" onclick="switchTab('wall')"><i class="fas fa-newspaper me-2"></i> Wall</button>
                <button class="nav-link" id="tab-profile" aria-label="Open profile" onclick="switchTab('profile')"><i class="fas fa-user-circle me-2"></i> Profile</button>
                <button class="nav-link d-none" id="tab-admin" aria-label="Open admin dashboard" onclick="switchTab('admin')"><i class="fas fa-shield-alt me-2"></i> Admin</button>

                <button class="nav-link text-warning" onclick="openFeedbackModal()">
                    <i class="fas fa-star me-2"></i> Rate Us
                </button>
            </div>
        </div>

        <div class="col-12 d-lg-none mb-3">
            <div class="nav nav-pills nav-fill mobile-nav-surface p-2 rounded-4 overflow-auto flex-nowrap gap-2">
                <button class="nav-link active" aria-label="Open messages" onclick="switchTab('messages')"><i class="fas fa-comment"></i><span class="mobile-nav-label">Messages</span></button>
                <button class="nav-link" aria-label="Open directory" onclick="switchTab('directory')"><i class="fas fa-users"></i><span class="mobile-nav-label">Directory</span></button>
                <button class="nav-link" aria-label="Open events" onclick="switchTab('events')"><i class="fas fa-calendar"></i><span class="mobile-nav-label">Events</span></button>
                <button class="nav-link" aria-label="Open jobs" onclick="switchTab('jobs')"><i class="fas fa-briefcase"></i><span class="mobile-nav-label">Jobs</span></button>
                <button class="nav-link" aria-label="Open profile" onclick="switchTab('profile')"><i class="fas fa-user"></i><span class="mobile-nav-label">Profile</span></button>
            </div>
        </div>

        <div class="col-lg-7">
            <div id="main-content" class="cc-shell-panel p-3 p-lg-4">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>

        <div class="col-lg-3 chat-column d-none d-lg-block">
            <div class="card chat-card">
                <div class="card-header bg-white fw-bold border-bottom">💬 Global Chat <span id="chatStatus" class="badge bg-secondary ms-2">...</span></div>
                <div id="chatArea" class="chat-box d-flex flex-column"></div>
                <div class="p-2 border-top bg-white">
                    <div class="input-group">
                        <input type="text" id="messageInput" class="form-control" placeholder="Type..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="dmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="dmModalTitle">Chat</h5>
                <button type="button" class="btn-close btn-close-white" aria-label="Close direct message modal" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body bg-light dm-messages-area" id="dmMessagesArea">
            </div>

            <div class="modal-footer flex-column align-items-stretch p-2">
                <div id="typingIndicator" class="text-muted small fst-italic px-2 mb-1 d-none"></div>
                <div class="input-group">
                    <input type="text" id="dmInput" class="form-control" placeholder="Type a message..." onkeypress="if(event.key==='Enter') window.sendDirectMessage()">
                    <button class="btn btn-primary" onclick="window.sendDirectMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="postJobModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Post Job</h5><button type="button" class="btn-close" aria-label="Close post job modal" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="text" id="jobTitle" class="form-control mb-2" placeholder="Job Title">
                <input type="text" id="jobCompany" class="form-control mb-2" placeholder="Company Name">
                <input type="text" id="jobLocation" class="form-control mb-2" placeholder="Location">
                <textarea id="jobDesc" class="form-control mb-2" placeholder="Job Description"></textarea>
                <input type="text" id="jobLink" class="form-control" placeholder="Application Link/Email">
            </div>
            <div class="modal-footer"><button class="btn btn-primary w-100" onclick="postJob()">Post Job</button></div>
        </div>
    </div>
</div>

<div class="modal fade" id="feedbackModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="fas fa-star"></i> Rate Your Experience</h5>
                <button type="button" class="btn-close" aria-label="Close feedback modal" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <p class="text-muted">How likely are you to recommend Campus Connect?</p>

                <div class="mb-3">
                    <div class="rating-stars">
                        <i class="far fa-star" onclick="setRating(1)" id="star1"></i>
                        <i class="far fa-star" onclick="setRating(2)" id="star2"></i>
                        <i class="far fa-star" onclick="setRating(3)" id="star3"></i>
                        <i class="far fa-star" onclick="setRating(4)" id="star4"></i>
                        <i class="far fa-star" onclick="setRating(5)" id="star5"></i>
                    </div>
                    <input type="hidden" id="feedbackRating" value="0">
                </div>

                <div class="form-floating">
                    <textarea class="form-control feedback-comment-box" placeholder="Leave a comment here" id="feedbackComment"></textarea>
                    <label for="feedbackComment">Tell us what we can improve...</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-info text-white" onclick="window.submitFeedback()">Submit Feedback</button>
            </div>
        </div>
    </div>
</div>

<div id="botIcon" onclick="toggleBot()"><i class="fas fa-robot fa-lg"></i></div>
<div id="botWindow" class="card shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <span>🤖 CampusBot</span><button class="btn btn-sm text-white icon-only-btn" aria-label="Close bot window" onclick="toggleBot()"><i class="fas fa-times"></i></button>
    </div>
    <div id="botMessages" class="card-body bg-light bot-messages">
        <div class="system-message text-center text-muted small mt-2">Ask about batch 2024 or placements!</div>
    </div>
    <div class="card-footer p-2 bg-white">
        <div class="input-group">
            <input type="text" id="botInput" class="form-control form-control-sm" placeholder="Ask..." onkeypress="if(event.key==='Enter') askBot()">
            <button class="btn btn-primary btn-sm" onclick="askBot()" aria-label="Send bot message" title="Send bot message"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3 shell-toast-container">
    <div id="liveToast" class="toast" role="alert">
        <div class="toast-header bg-primary text-white">
            <strong class="me-auto">New Message</strong>
                <button type="button" class="btn-close btn-close-white" aria-label="Close toast" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body bg-white" id="toastBody"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script type="module" src="js/dashboard-main.js"></script>
</body>
</html>
