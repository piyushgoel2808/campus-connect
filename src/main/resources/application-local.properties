# ==============================================================================
# Campus Connect (GradLink) - Local Standalone Profile (application-local.properties)
# ==============================================================================
# Purpose:
#   Enables instant, zero-configuration local execution on macOS/Linux/Windows
#   without requiring a local MySQL daemon or Docker instance.
#
# Storage:
#   Uses a file-based embedded H2 database running in MySQL 8.0 compatibility mode.
#   All tables, users, jobs, posts, chats, and AI embeddings persist across restarts
#   in the './data/campus_connect_local' database directory.
# ==============================================================================

# 1. Embedded H2 Database (Persistent File-based, MySQL 8 Compatibility Mode)
spring.datasource.url=jdbc:h2:file:./data/campus_connect_local;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. JPA & Hibernate Lifecycle
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# 3. Direct Local Ollama Daemon Connection (Mac GPU)
ollama.base-url=http://localhost:11434
ollama.chat-model=gemma4:e4b
ollama.embedding-model=nomic-embed-text
ollama.auth-header=X-GradBot-Key
ollama.auth-token=
