# ==============================================================================
# CAMPUS CONNECT - APPLICATION CONFIGURATION
# ==============================================================================
# This file configures the Spring Boot backend server, MySQL database connection,
# Hibernate ORM behavior, SMTP email service, and multipart file upload limits.
# Note: In Docker deployments, several of these values (such as datasource URL
# and upload directory) can be overridden via environment variables.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. APPLICATION & SERVER SETTINGS
# ------------------------------------------------------------------------------
# Logical name of the Spring Boot application
spring.application.name=CampusConnect

# HTTP port on which the embedded Tomcat server listens (http://localhost:8080)
server.port=8080

# ------------------------------------------------------------------------------
# 2. MYSQL DATABASE CONFIGURATION
# ------------------------------------------------------------------------------
# JDBC connection URL for MySQL 8:
# - createDatabaseIfNotExist=true : Automatically creates 'campus_connect_db' if missing
# - useSSL=false                  : Disables SSL for local/container development
# - serverTimezone=UTC            : Standardizes timestamps to UTC
# - allowPublicKeyRetrieval=true  : Required by MySQL 8 caching_sha2_password auth
spring.datasource.url=jdbc:mysql://localhost:3306/campus_connect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin@123

# ------------------------------------------------------------------------------
# 3. JPA & HIBERNATE ORM SETTINGS
# ------------------------------------------------------------------------------
# Automatically updates database schema tables/columns to match @Entity classes on startup
spring.jpa.hibernate.ddl-auto=update

# Logs generated SQL queries to the console for debugging and development visibility
spring.jpa.show-sql=true

# Configures Hibernate to generate SQL optimized for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# 4. SMTP EMAIL CONFIGURATION (Admin Broadcasts)
# ------------------------------------------------------------------------------
# Used by EmailService to send broadcast announcements to all registered users.
# Requires a 16-character Google App Password (from Google Account > Security) to send via Gmail.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ------------------------------------------------------------------------------
# 5. MULTIPART FILE UPLOAD CONFIGURATION
# ------------------------------------------------------------------------------
# Maximum allowed size for a single uploaded file (e.g., post images, Excel/CSV user sheets)
spring.servlet.multipart.max-file-size=10MB

# Maximum allowed total payload size for a multipart/form-data HTTP request
spring.servlet.multipart.max-request-size=10MB

# Local filesystem directory (relative to working directory) where uploaded files are stored
upload.dir=uploads

# ------------------------------------------------------------------------------
# 6. OLLAMA AI RUNTIME CONFIGURATION (GradBot Assistant)
# ------------------------------------------------------------------------------
# Local Ollama daemon endpoint hosting Gemma 4 and nomic-embed-text
# Environment variables allow overriding inside Docker containers or Render
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.chat-model=${OLLAMA_CHAT_MODEL:gemma4:e4b}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:embeddinggemma-2:latest}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:60}
# Shared secret authentication header for remote tunnel runner (Mac to Render)
ollama.auth-header=${OLLAMA_AUTH_HEADER:X-GradBot-Key}
ollama.auth-token=${OLLAMA_AUTH_TOKEN:}

# ------------------------------------------------------------------------------
# 7. QDRANT VECTOR DATABASE CONFIGURATION (GradBot Vector Retrieval)
# ------------------------------------------------------------------------------
# In local dev: connects to http://localhost:6333
# In Render: multiplexes over the Cloudflare tunnel via ${OLLAMA_BASE_URL}/qdrant
qdrant.base-url=${QDRANT_BASE_URL:${ollama.base-url}/qdrant}
qdrant.collection-name=${QDRANT_COLLECTION_NAME:campus_knowledge}
qdrant.auth-header=${ollama.auth-header:X-GradBot-Key}
qdrant.auth-token=${ollama.auth-token:}
qdrant.timeout-seconds=10
