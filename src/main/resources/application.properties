# ==============================================================================
# CAMPUS CONNECT - APPLICATION CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. APPLICATION & SERVER SETTINGS
# ------------------------------------------------------------------------------
spring.application.name=CampusConnect
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# 2. MYSQL DATABASE CONFIGURATION
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_connect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin@123}

# ------------------------------------------------------------------------------
# 3. JPA & HIBERNATE ORM SETTINGS
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# 4. SECURITY, JWT, CORS & DEMO SEEDING
# ------------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:}
app.seed-demo-data=${APP_SEED_DEMO_DATA:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,https://campus-connect-live.onrender.com}

# ------------------------------------------------------------------------------
# 5. SMTP EMAIL CONFIGURATION (Admin Broadcasts)
# ------------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ------------------------------------------------------------------------------
# 6. MULTIPART FILE UPLOAD CONFIGURATION
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=${UPLOAD_DIR:uploads}

# ------------------------------------------------------------------------------
# 7. OLLAMA AI RUNTIME CONFIGURATION (GradBot Assistant)
# ------------------------------------------------------------------------------
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.chat-model=${OLLAMA_CHAT_MODEL:gemma4:e4b}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:embeddinggemma-2:latest}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:60}
ollama.auth-header=${OLLAMA_AUTH_HEADER:X-GradBot-Key}
ollama.auth-token=${OLLAMA_AUTH_TOKEN:}
ai.runner.allowed-domains=${AI_RUNNER_ALLOWED_DOMAINS:trycloudflare.com}
ai.scrape.allowed-domains=${AI_SCRAPE_ALLOWED_DOMAINS:bvicam.in}
ai.rag.max-fallback-chunks=${AI_RAG_MAX_FALLBACK_CHUNKS:500}

# Automated Non-Intrusive BVICAM Portal Auto-Sync (Notices every 24h + Syllabi + Course Materials)
ai.sync.enabled=${AI_SYNC_ENABLED:true}
ai.sync.startup-backfill=${AI_SYNC_STARTUP_BACKFILL:true}
ai.sync.base-url=${AI_SYNC_BASE_URL:https://bvicam.in}
ai.sync.notice-cron=${AI_SYNC_NOTICE_CRON:0 0 2 * * *}
ai.sync.full-cron=${AI_SYNC_FULL_CRON:0 30 3 * * 0}
ai.sync.request-delay-ms=${AI_SYNC_REQUEST_DELAY_MS:1200}
ai.sync.max-pdf-bytes=${AI_SYNC_MAX_PDF_BYTES:20971520}
ai.sync.max-chunks-per-doc=${AI_SYNC_MAX_CHUNKS_PER_DOC:120}
ai.sync.ocr-scanned-pdfs=${AI_SYNC_OCR_SCANNED_PDFS:true}
ai.sync.ocr-max-pages=${AI_SYNC_OCR_MAX_PAGES:3}

# ------------------------------------------------------------------------------
# 8. QDRANT VECTOR DATABASE CONFIGURATION (GradBot Vector Retrieval)
# ------------------------------------------------------------------------------
qdrant.base-url=${QDRANT_BASE_URL:${ollama.base-url}/qdrant}
qdrant.collection-name=${QDRANT_COLLECTION_NAME:campus_knowledge}
qdrant.auth-header=${ollama.auth-header:X-GradBot-Key}
qdrant.auth-token=${ollama.auth-token:}
qdrant.timeout-seconds=10
