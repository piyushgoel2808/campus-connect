# ==============================================================================
# Campus Connect (GradLink) - Test Profile Configuration (application-test.properties)
# ==============================================================================
# Activated via @ActiveProfiles("test") during JUnit tests so tests run against
# an isolated in-memory H2 database (in MySQL compatibility mode) instead of MySQL.
# ==============================================================================

# 1. In-Memory H2 Database (MySQL Compatibility Mode)
spring.datasource.url=jdbc:h2:mem:campus_connect_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. JPA / Hibernate Schema Lifecycle for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# 3. Mock / Local SMTP Mail Configuration
spring.mail.host=localhost
spring.mail.port=3025

# 4. Test JWT Signing Secret (256-bit Hex Key)
app.jwt.secret=5367566B59703373367639792B423F4528482B4D6251655468576D5A71347437