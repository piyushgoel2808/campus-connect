# ==============================================================================
# Campus Connect - Docker Compose Orchestration
# ==============================================================================
# Purpose:
#   Defines the local multi-container development and deployment stack:
#     1. mysql:  Persistent MySQL 8.0 relational database instance.
#     2. qdrant: Persistent Qdrant vector database for GradBot AI embeddings.
#     3. app:    The Campus Connect Spring Boot web & WebSocket server.
#
# Key Relationships & Networking:
#   - Services share a default Docker bridge network, allowing `app` to
#     connect to MySQL at `mysql:3306` and Qdrant at `qdrant:6333`.
#   - `app` waits for `mysql` and `qdrant` to pass readiness healthchecks before starting.
# ==============================================================================

name: campus-connect

services:
  # ----------------------------------------------------------------------------
  # Database Service: MySQL 8.0
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: campus-connect-mysql
    restart: unless-stopped
    environment:
      # Root credentials and default schema automatically provisioned on first boot
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin@123}
      MYSQL_DATABASE: campus_connect_db
    ports:
      # Maps host port 3307 (or MYSQL_PORT) -> container port 3306
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      # Persists database tables and records across container restarts
      - campus_mysql_data:/var/lib/mysql
    healthcheck:
      # Periodically pings MySQL so dependent services know when it is ready to accept connections
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # Vector Database: Qdrant (HNSW Vector Indexing)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: campus-connect-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - campus_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # Application Service: Campus Connect Spring Boot Server
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-connect-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      # Exposes the web UI, REST APIs, and STOMP WebSocket endpoints (default http://localhost:8080)
      - "${APP_PORT:-8080}:8080"
    environment:
      # Overrides application.properties with container-aware JDBC connection and upload directory settings
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campus_connect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin@123}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      UPLOAD_DIR: /app/uploads
      QDRANT_BASE_URL: http://qdrant:6333
      # Connects containerized Spring Boot to host machine's Ollama daemon.
      # Note: Ensure host Ollama is started with OLLAMA_HOST=0.0.0.0 if running on Linux hosts.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mounts host ./uploads directory into the container so user-uploaded media persists
      - ./uploads:/app/uploads

# ------------------------------------------------------------------------------
# Named Volumes
# ------------------------------------------------------------------------------
volumes:
  campus_mysql_data:
  campus_qdrant_data:
